<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forkcloser</title>
  <meta name="description" content="Forkcloser: a collection of forks and ports focused on performance and correctness.">
  <link rel="canonical" href="https://forkcloser.org/">
  <meta name="theme-color" content="#fbf8f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1a16" media="(prefers-color-scheme: dark)">
  <script>try{var t=localStorage.getItem("forkcloser-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="forkcloser.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="forkcloser.js" defer></script>
</head>
<body>
  <main class="wrap" id="main">
    <h1>Forkcloser</h1>
    <p>A collection of forks and ports focused on performance and correctness.</p>
    <p>This site is being built. The projects are at <a href="https://github.com/forkcloser">github.com/forkcloser</a>.</p>
  </main>
</body>
</html>
